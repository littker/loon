# QQ音乐 每日任务/定时金币/红包雨 —— Egern 模块
name: QQ音乐签到
description: QQ音乐积分每日任务、定时金币、红包雨（抓 Cookie 后自动续期签到）
author: MaYIHEI
homepage: https://github.com/MaYIHEI/paperclip
icon: https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/qqmusic.png

# 抓 Cookie 需要解密 u6.y.qq.com 的 HTTPS 请求（含请求体）
# 首次使用务必：工具 → 证书 → 生成/安装 CA 证书，并在「设置 → 通用 → 关于 → 证书信任设置」开启完全信任
mitm:
  hostnames:
    - u6.y.qq.com

env_schema:
  debug:
    name: 调试模式
    description: 打开后打印请求/响应（敏感字段已打码）
    options:
      - "true"
      - "false"

scriptings:
  # 1) 抓 Cookie：打开 QQ音乐 →「我的/会员/每日签到」或「金币中心/每日签到」时自动抓取
  - http_request:
      name: QQ音乐-抓Cookie
      match: '^https://u6\.y\.qq\.com/cgi-bin/musics\.fcg\?.*(EveryDaySignLvzScore|GetSignInSummary)'
      # ↓↓↓ 改成你托管后的 qqmusic-egern.js 地址（本地用则填本地路径）
      script_url: https://raw.githubusercontent.com/littker/loon/refs/heads/main/qq%20music.js
      body_required: true
      max_size: 10485760
      timeout: 30

  # 2) 每日任务（每天 07:30）
  - schedule:
      name: QQ音乐-每日任务
      cron: "30 7 * * *"
      script_url: https://raw.githubusercontent.com/littker/loon/refs/heads/main/qq%20music.js
      timeout: 600
      update_interval: 86400

  # 3) 定时金币（每天 9-10 点之间每分钟检查一次）
  - schedule:
      name: QQ音乐-定时金币
      cron: "* 9-10 * * *"
      script_url: https://raw.githubusercontent.com/littker/loon/refs/heads/main/qq%20music.js
      timeout: 600
      update_interval: 86400

  # 4) 红包雨（0/8/12/16/20/22 点的第 5 分钟）
  - schedule:
      name: QQ音乐-红包雨
      cron: "5 0,8,12,16,20,22 * * *"
      script_url: https://raw.githubusercontent.com/littker/loon/refs/heads/main/qq%20music.js
      timeout: 600
      update_interval: 86400
